name: Publish Python Package

on:
  push:
    tags:
      - "v*"   # runs only when you push tags like v0.1.0a1

jobs:
  build:
    # Skipped when the pushed commit's message says [skip ci], [ci skip], [no ci], [skip actions] or
    # [actions skip]: GitHub skips push and pull_request runs for them itself, and this makes it
    # explicit and covers tag pushes too. Run workflow (workflow_dispatch) is never skipped.
    if: >-
      github.event_name != 'push' || !(
      contains(github.event.head_commit.message, '[skip ci]') ||
      contains(github.event.head_commit.message, '[ci skip]') ||
      contains(github.event.head_commit.message, '[no ci]') ||
      contains(github.event.head_commit.message, '[skip actions]') ||
      contains(github.event.head_commit.message, '[actions skip]'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

